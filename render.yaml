services:
  - type: web
    name: neura-folio-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: INGEST_SECRET
        sync: false
      - key: GITHUB_USERNAME
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: EMBEDDING_PROVIDER
        value: local
      - key: AGENT_MODE
        value: "true"
      - key: RAG_HYBRID
        value: "true"

  - type: cron
    name: neura-folio-ingest
    runtime: node
    rootDir: backend
    plan: free
    schedule: "0 0 * * *"
    buildCommand: npm install && npm run build
    startCommand: npm run ingest
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        sync: false
      - key: GITHUB_USERNAME
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: EMBEDDING_PROVIDER
        value: local
